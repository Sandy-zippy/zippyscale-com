<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZippyScale</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FFFDF7; --charcoal:#2A2A35; --lime:#D5EB4B; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--cream); color:var(--charcoal);
    font-family:Inter, system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px 24px;
  }
  main { max-width:420px; width:100%; }
  .mark {
    font-family:'Space Grotesk', system-ui, sans-serif; font-weight:700;
    font-size:28px; letter-spacing:-0.02em; margin:0 0 28px;
  }
  .mark span { color:var(--lime); -webkit-text-stroke:0.6px var(--charcoal); }
  .rule { height:3px; width:44px; background:var(--lime); margin:0 0 28px; }
  h1 {
    font-family:'Space Grotesk', system-ui, sans-serif; font-weight:500;
    font-size:20px; line-height:1.45; margin:0 0 16px; letter-spacing:-0.01em;
  }
  p { font-size:15px; line-height:1.6; margin:0 0 20px; opacity:0.75; }
  a { color:var(--charcoal); text-decoration:underline; text-underline-offset:3px; }
  a:hover { text-decoration-color:var(--lime); }
  footer { margin-top:36px; font-size:13px; opacity:0.5; }
</style>
</head>
<body>
<main>
  <p class="mark">Zippy<span>Scale</span></p>
  <div class="rule"></div>
  <h1>This site is being rebuilt.</h1>
  <p>We are a marketing team working with real estate agents in North America. The site is coming back shortly with what we actually do now.</p>
  <p>Until then, email <a href="mailto:sandy@zippyscale.com">sandy@zippyscale.com</a>.</p>
  <footer>ZippyScale &middot; Hyderabad, India</footer>
</main>
</body>
</html>
